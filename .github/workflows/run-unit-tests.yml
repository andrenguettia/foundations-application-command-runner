name: Run Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/run-unit-tests.yml"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Restore, build, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ACR.slnx

      - name: Build
        run: dotnet build ACR.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ACR.slnx --configuration Release --no-build --verbosity detailed

      - name: Dump log errors to the console
        if: always()
        run: |
          shopt -s globstar nullglob
          for log in **/TestResults/*.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Upload test result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          retention-days: 14